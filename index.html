<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שיבוץ נוער שוחר מדע</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 4h8M13.5 4v8.5L6.5 25a2.5 2.5 0 0 0 2.2 3.7h14.6a2.5 2.5 0 0 0 2.2-3.7l-7-12.5V4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 20h12.8l2.9 5.3a1.6 1.6 0 0 1-1.4 2.4H8.1a1.6 1.6 0 0 1-1.4-2.4z" fill="currentColor" opacity=".35"/></svg>
      <div>
        <h1>שיבוץ מדריכים</h1>
        <p class="brand-sub">נוער שוחר מדע · ימי עיון, קורסים, הרצאות ומופעי קסמים</p>
      </div>
    </div>
    <nav class="tabs" aria-label="תצוגות">
      <button class="tab" data-view="board" id="tab-board">שיבוץ</button>
      <button class="tab" data-view="people" id="tab-people">מדריכים</button>
      <button class="tab" data-view="export" id="tab-export">ייצוא</button>
      <button class="tab" data-view="files" id="tab-files">קבצים</button>
    </nav>
  </div>
</header>

<div id="demo-banner" class="demo-banner" hidden>
  <div class="wrap">
    <strong>נתוני דוגמה.</strong>
    השמות והאירועים כאן מומצאים, כדי להראות איך זה עובד. שינויים בדוגמה לא נשמרים.
    <button class="btn btn-small" data-go="files" id="demo-import">ייבוא הקבצים שלי</button>
  </div>
</div>

<main class="wrap">
  <section id="view-board" class="view" hidden></section>
  <section id="view-people" class="view" hidden></section>
  <section id="view-export" class="view" hidden></section>
  <section id="view-files" class="view" hidden></section>
</main>

<dialog id="dialog" class="sheet" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
