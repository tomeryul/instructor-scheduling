<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שיבוץ נוער שוחר מדע</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar" id="navbar" data-scrolled="false">
  <div class="nav-leading" id="nav-leading"></div>
  <div class="nav-title" id="nav-title" aria-hidden="true"></div>
  <div class="nav-actions" id="nav-actions"></div>
</header>

<nav class="tabbar glass" id="tabbar" aria-label="מסכים">
  <button class="tab" data-view="board" id="tab-board"><span data-icon="calendar.fill"></span><span>שיבוץ</span></button>
  <button class="tab" data-view="people" id="tab-people"><span data-icon="person.2.fill"></span><span>מדריכים</span></button>
  <button class="tab" data-view="export" id="tab-export"><span data-icon="doc.fill"></span><span>ייצוא</span></button>
  <button class="tab" data-view="files" id="tab-files"><span data-icon="folder.fill"></span><span>קבצים</span></button>
</nav>

<main class="page">
  <section id="view-board" class="view" hidden></section>
  <section id="view-people" class="view" hidden></section>
  <section id="view-export" class="view" hidden></section>
  <section id="view-files" class="view" hidden></section>
</main>

<dialog id="dialog" class="sheet" aria-labelledby="dialog-title"></dialog>
<dialog id="alert" class="alert" role="alertdialog" aria-labelledby="alert-title" tabindex="-1"></dialog>
<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
